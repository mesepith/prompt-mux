# nginx reverse proxy for PromptMux — copy to /etc/nginx/sites-available/promptmux,
# symlink into sites-enabled, then: sudo nginx -t && sudo systemctl reload nginx
# Add TLS with certbot: sudo certbot --nginx -d your-domain.com
#
# Auth lives in the app (APP_PASSWORD in server/.env, HTTP Basic). nginx forwards the
# Authorization header as-is, so don't add a second auth_basic here and don't strip it.
# Do finish the certbot step: Basic auth sends the password on every request, so over
# plain HTTP it travels in the clear.

server {
    listen 80;
    server_name your-domain.com;  # <- change me

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE chat streams: no buffering, generous timeouts
    location /api/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
